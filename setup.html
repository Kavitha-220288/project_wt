<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Walletly — Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#080b12;--card:#0f1320;--card2:#161b2e;--border:#1e2540;--accent:#5b7cfa;--accent2:#7c5bf5;--success:#34d399;--danger:#f87171;--text:#e8edf8;--muted:#6b7494;--dim:#353c5a}
    body.light{--bg:#f0f2fb;--card:#fff;--card2:#f4f5fc;--border:#dde1f2;--accent:#4060f0;--accent2:#6535ee;--text:#18203a;--muted:#556080;--dim:#aab2ce}
    body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;transition:background .25s,color .25s;background-image:radial-gradient(ellipse 70% 60% at 15% 20%,rgba(91,124,250,.1) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 85% 80%,rgba(124,91,245,.07) 0%,transparent 60%)}
    .wrap{width:100%;max-width:500px}
    .toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
    .brand{display:flex;align-items:center;gap:.6rem}
    .brand-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;box-shadow:0 4px 14px rgba(91,124,250,.35)}
    .brand-name{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:600;color:var(--text)}
    .theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .25s}
    .theme-btn:hover{border-color:var(--accent);transform:rotate(15deg)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:fadeUp .6s .1s ease both}
    .steps{display:flex;align-items:center;gap:.4rem;margin-bottom:2rem}
    .step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;flex-shrink:0}
    .step.done{background:var(--success);color:#0a1a12}
    .step.active{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(91,124,250,.25)}
    .step.idle{background:var(--card2);color:var(--dim);border:1px solid var(--border)}
    .step-line{flex:1;height:2px;background:var(--border);border-radius:1px}
    .step-line.done{background:var(--success)}
    h2{font-family:'Playfair Display',serif;font-size:1.55rem;margin-bottom:.35rem;color:var(--text)}
    .sub{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
    .field{margin-bottom:1rem}
    .field label{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.06em}
    .field input{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-family:'Sora',sans-serif;font-size:.9rem;padding:.75rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
    .field input::placeholder{color:var(--dim)}
    .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,124,250,.12)}
    .cur-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
    .cur-btn{background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:.65rem .5rem;text-align:center;cursor:pointer;transition:all .2s;font-family:'Sora',sans-serif;color:var(--muted);font-size:.83rem}
    .cur-btn:hover{border-color:var(--accent);color:var(--accent)}
    .cur-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(91,124,250,.1)}
    .cur-sym{font-size:1.1rem;display:block;margin-bottom:.2rem}
    .preview-box{background:linear-gradient(135deg,rgba(91,124,250,.1),rgba(124,91,245,.06));border:1px solid rgba(91,124,250,.2);border-radius:12px;padding:.9rem 1.1rem;margin-bottom:1.2rem;display:none;justify-content:space-between;align-items:center}
    .preview-box .pb-label{font-size:.75rem;color:var(--muted)}
    .preview-box .pb-amt{font-size:1.25rem;font-weight:700;color:var(--accent)}
    .cats{margin-top:.8rem}
    .cats p{font-size:.75rem;color:var(--muted);margin-bottom:.5rem}
    .cat-chips{display:flex;flex-wrap:wrap;gap:.35rem}
    .cat-chip{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:.28rem .75rem;font-size:.73rem;color:var(--muted)}
    .btn-primary{width:100%;padding:.85rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-family:'Sora',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:1.2rem;transition:all .25s;box-shadow:0 4px 20px rgba(91,124,250,.3)}
    .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 28px rgba(91,124,250,.4)}
    .btn-primary:disabled{opacity:.65;cursor:not-allowed}
    .toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.75rem 1.4rem;font-size:.85rem;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast.error{border-color:var(--danger);color:var(--danger)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toprow">
      <div class="brand">
        <div class="brand-icon">💳</div>
        <span class="brand-name">Walletly</span>
      </div>
      <button class="theme-btn" id="themeBtn">☀️</button>
    </div>

    <div class="card">
      <div class="steps">
        <div class="step done">✓</div>
        <div class="step-line done"></div>
        <div class="step active">2</div>
        <div class="step-line"></div>
        <div class="step idle">3</div>
      </div>
      <h2>Set up your wallet</h2>
      <p class="sub">Choose your currency and set a monthly budget</p>

      <div class="field">
        <label>Currency</label>
        <div class="cur-grid" id="curGrid">
          <div class="cur-btn sel" data-code="INR" data-sym="₹"><span class="cur-sym">₹</span>INR</div>
          <div class="cur-btn" data-code="USD" data-sym="$"><span class="cur-sym">$</span>USD</div>
          <div class="cur-btn" data-code="EUR" data-sym="€"><span class="cur-sym">€</span>EUR</div>
          <div class="cur-btn" data-code="GBP" data-sym="£"><span class="cur-sym">£</span>GBP</div>
          <div class="cur-btn" data-code="JPY" data-sym="¥"><span class="cur-sym">¥</span>JPY</div>
          <div class="cur-btn" data-code="CAD" data-sym="C$"><span class="cur-sym">C$</span>CAD</div>
        </div>
      </div>

      <div class="field" style="margin-top:.8rem">
        <label>Monthly Budget</label>
        <input type="number" id="budgetInput" placeholder="e.g. 25000" min="1"/>
      </div>

      <div class="preview-box" id="previewBox">
        <div><div class="pb-label">Monthly budget set to</div></div>
        <div class="pb-amt" id="previewAmt">₹0</div>
      </div>

      <div class="cats">
        <p>Track expenses across these categories:</p>
        <div class="cat-chips">
          <span class="cat-chip">🍔 Food</span><span class="cat-chip">🚗 Travel</span>
          <span class="cat-chip">🛍 Shopping</span><span class="cat-chip">💡 Bills</span>
          <span class="cat-chip">🎬 Entertainment</span><span class="cat-chip">❤️ Health</span>
          <span class="cat-chip">📚 Education</span><span class="cat-chip">📦 Other</span>
        </div>
      </div>

      <button class="btn-primary" id="saveBtn">Get Started →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/common.js"></script>
  <script>
    window.initTheme();
    document.getElementById('themeBtn').onclick = window.toggleTheme;

    var selCode = 'INR', selSym = '₹';

    // Currency selection
    document.getElementById('curGrid').onclick = function(e) {
      var btn = e.target.closest('.cur-btn');
      if (!btn) return;
      document.querySelectorAll('.cur-btn').forEach(function(b){ b.classList.remove('sel'); });
      btn.classList.add('sel');
      selCode = btn.dataset.code;
      selSym  = btn.dataset.sym;
      updatePreview();
    };

    document.getElementById('budgetInput').oninput = updatePreview;

    function updatePreview() {
      var val = Number(document.getElementById('budgetInput').value);
      var box = document.getElementById('previewBox');
      if (val > 0) {
        box.style.display = 'flex';
        document.getElementById('previewAmt').textContent = selSym + val.toLocaleString('en-IN');
      } else {
        box.style.display = 'none';
      }
    }

    function toast(msg, type) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (type ? ' '+type : '');
      clearTimeout(el._t);
      el._t = setTimeout(function(){ el.classList.remove('show'); }, 3000);
    }

    // Auth guard — redirect if not logged in
    fbAuth.onAuthStateChanged(function(user) {
      if (!user) { window.location.href = 'index.html'; return; }
      fbDB.ref('users/'+user.uid).get().then(function(snap) {
        var d = snap.val();
        if (d && d.budget) { window.location.href = 'dashboard.html'; }
      });
    });

    document.getElementById('saveBtn').onclick = function() {
      var budget = Number(document.getElementById('budgetInput').value);
      if (!budget || budget <= 0) { toast('Please enter a valid budget', 'error'); return; }
      var user = fbAuth.currentUser;
      if (!user) { window.location.href = 'index.html'; return; }
      var btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      fbDB.ref('users/'+user.uid).update({
        budget: budget, currency: selCode, symbol: selSym,
        email: user.email, setupAt: Date.now()
      }).then(function() {
        window.location.href = 'dashboard.html';
      }).catch(function(e) {
        toast('Error: '+e.message, 'error');
        btn.disabled = false; btn.textContent = 'Get Started →';
      });
    };
  </script>
</body>
</html>
